version: 1.0.0
id: sg.agent.media-operations
slug: media-operations
name: Media Operations Agent
release: V1
runtime: CLOUDFLARE_AGENT
domain: operations
mode: EXECUTE
mission: Handles media processing, distribution health, upload recovery and delivery
  operations within policy.
default_capabilities:
- agent.task.read
- agent.task.propose
input_contracts:
- contracts/agents/task.yaml
output_contracts:
- contracts/agents/task-result.yaml
global_rules:
- Read AGENTS.md, relevant DESIGN.md, SKILL.md, task contract, affected domain contracts,
  ADRs and ownership map before implementation.
- Never infer authorization from natural language instructions.
- Use deterministic state machines and canonical contracts.
- Record provenance, correlationId, taskId and policyDecisionId for material actions.
- Stop on contract conflicts instead of silently adapting the contract.
forbidden:
- secrets
- raw_credentials
- unscoped_database_access
- implicit_production_write
approval: Use Policy Engine; human approval for high-risk/production unless an explicit
  policy says otherwise.
