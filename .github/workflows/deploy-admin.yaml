name: Deploy Admin (Fly.io)

on:
  push:
    branches: [dev, staging]
    paths:
      - 'apps/admin/**'
      - 'packages/ui/**'
      - 'packages/domain/**'
      - 'packages/config/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --config apps/admin/fly.toml --dockerfile apps/admin/Dockerfile --app storygalore-admin-${{ github.ref_name }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
