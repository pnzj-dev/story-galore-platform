# fly.toml — apps/admin (standalone SvelteKit admin console).
# Deployed per environment via `flyctl deploy --app storygalore-admin-<env>`.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
