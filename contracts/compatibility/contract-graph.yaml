version: '1.0'
canonical: true
rules:
- Every domain has exactly one canonical state-machine source.
- Every source-of-truth mutation maps to a command and versioned event.
- Every persistence resource is registered exactly once.
- MCP tools and UI mutations are adapters over domain commands/queries, never alternate
  business logic.
- Authorization and Policy Engine decisions are evaluated before externally visible
  mutations.
- Cloudflare Workflows is orchestration only; authoritative state remains in domain persistence.
