specializedContexts:
  media:
    stateMachines:
    - contracts/state-machines/media.yaml
    - contracts/state-machines/media-upload.yaml
    - contracts/state-machines/media-distribution.yaml
    canonicalPersistence: docs/MEDIA_STORAGE_AND_DISTRIBUTION.md
    invariants:
    - Appwrite is canonical origin
    - Cloudflare is PRIMARY distribution only
    - Bunny is SECONDARY distribution only
    - SECONDARY can be disabled by authorized admin configuration
    - authorization precedes protected delivery
    - distributor selection never implements business entitlement or age policy
  studio:
    stateMachines:
    - contracts/state-machines/studio.yaml
    - contracts/state-machines/studio-editor.yaml
    canonicalPersistence: contracts/studio/persistence-mapping.yaml
    invariants:
    - Studio authoring state is revisioned
    - published snapshots are immutable
    - UI never writes Appwrite directly
