schema: storygalore.secret-registry/v1
version: 1
policy: fail_closed
rules:
- Every secret MUST have one canonical owner and purpose.
- Secret values MUST never be committed, logged, audited, indexed, cached or sent to agents.
- Runtime access MUST be explicitly granted to named executors.
- Rotation and revocation MUST be defined before production use.
- Missing secret declarations are BLOCKED.
fields:
- id
- owner
- purpose
- scope
- storage
- allowed_executors
- rotation
- expiration
- audit
- redaction
entries:
- id: PAYMENT_PROVIDER_API_CREDENTIAL
  owner: payments
  purpose: Provider API authentication for registered payment adapters
  scope: provider_adapter_runtime
  storage: APPWRITE_FUNCTION_SECRET_OR_REGISTERED_SECRET_MANAGER
  allowed_executors:
  - registered_payment_adapter_functions
  rotation: REGISTERED_PROVIDER_ROTATION_POLICY
  expiration: PROVIDER_DEFINED_OR_POLICY_REQUIRED
  audit: ACCESS_AUDITED
  redaction: FULL
- id: PAYMENT_PROVIDER_WEBHOOK_SECRET
  owner: payments
  purpose: Webhook signature verification for registered payment providers
  scope: provider_webhook_runtime
  storage: APPWRITE_FUNCTION_SECRET_OR_REGISTERED_SECRET_MANAGER
  allowed_executors:
  - registered_payment_webhook_functions
  rotation: REGISTERED_PROVIDER_ROTATION_POLICY
  expiration: PROVIDER_DEFINED_OR_POLICY_REQUIRED
  audit: ACCESS_AUDITED
  redaction: FULL
- id: PAYOUT_PROVIDER_API_CREDENTIAL
  owner: payments
  purpose: Creator payout execution for registered payout providers
  scope: payout_adapter_runtime
  storage: APPWRITE_FUNCTION_SECRET_OR_REGISTERED_SECRET_MANAGER
  allowed_executors:
  - registered_payout_adapter_functions
  rotation: REGISTERED_PROVIDER_ROTATION_POLICY
  expiration: PROVIDER_DEFINED_OR_POLICY_REQUIRED
  audit: ACCESS_AUDITED
  redaction: FULL
