completion_rule: Every selected technology must have a fresh, dated entry for the current run; entries from earlier runs do not satisfy this gate. Implementation and release remain blocked until all entries are complete and compatibility validation passes.
entry_schema:
  technology_id: required
  category: required
  selected_version_exact: required
  latest_stable_version_verified: required
  official_source_url: required
  checked_at_utc: required
  prerelease: required_boolean_false
  compatibility_tests: required_pass
  lockfile_or_pin_location: required
  exception_adr: required_null_or_approved_adr
  resolution_run_id: required_unique_per_run
  source_release_date_or_registry_published_at: required
  source_evidence_digest_or_snapshot: required
  compatibility_test_report: required
  latest_stable_comparison_result: required_equal_or_approved_exception
run_policy:
  freshness_scope: current-bootstrap-or-release-candidate-only
  previous_run_reusable: false
  version_must_equal_latest_stable_at_checked_at_utc: true
  exact_package_manager_version_required: true
  exact_cli_versions_required: true
  lockfiles_required_before_implementation: true
  block_when_any_entry_missing_or_stale: true
