$schema: https://json-schema.org/draft/2020-12/schema
title: Studio Editor Geometry
version: 1
type: object
required: [coordinateSystem, canvas, safeArea, bleed]
properties:
  coordinateSystem:
    const: NORMALIZED_0_1
  canvas:
    type: object
    required: [width, height, aspectRatio]
    properties:
      width: {type: number, exclusiveMinimum: 0}
      height: {type: number, exclusiveMinimum: 0}
      aspectRatio: {type: number, exclusiveMinimum: 0}
  safeArea:
    $ref: '#/$defs/rect'
  bleed:
    $ref: '#/$defs/rect'
  defaults:
    type: object
    properties:
      minPanelWidth: {type: number, minimum: 0}
      minPanelHeight: {type: number, minimum: 0}
      maxRotationDegrees: {type: number, minimum: 0, maximum: 360}
$defs:
  rect:
    type: object
    required: [x, y, width, height]
    properties:
      x: {type: number, minimum: 0, maximum: 1}
      y: {type: number, minimum: 0, maximum: 1}
      width: {type: number, minimum: 0, maximum: 1}
      height: {type: number, minimum: 0, maximum: 1}
