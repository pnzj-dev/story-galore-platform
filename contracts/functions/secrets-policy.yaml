schema: storygalore.function-secrets/v1
version: 1
policy: deterministic
rules:
  - Secrets are references, never ordinary input payloads.
  - Secrets MUST NOT enter LLM context, audit payloads, analytics, event payloads, or workflow history.
  - Secrets MUST be least-privilege and function-scoped.
  - Secret access MUST be declared in the function definition.
  - Missing secret access is BLOCKED, never replaced with an environment fallback chosen by the agent.
  - Plaintext secret logging is forbidden.
