schema: storygalore.function-input/v1
function: central-agent-gateway
status: normative
content_type: application/json
required_fields:
  - request_id
  - trace_id
  - task_id
  - capability_id
  - storygalore_tool_id
  - schema_version
  - input
conditionally_required_fields:
  - idempotency_key: required_for_mutations
  - tenant_id: required_when_resource_scope_is_tenant_bound
  - approval_reference: required_when_policy_requires_approval
trust_rules:
  agent_identity: derived_from_verified_runtime_invocation_context_not_input_payload
  actor_identity: derived_from_verified_runtime_invocation_context_or_registered_system_actor
  tenant_id: treated_as_untrusted_selector_until_authorized_against_actor_and_resource
  storygalore_tool_id: stable_registry_id_only_native_tool_names_are_rejected
  input: validated_against_exact_registered_tool_schema
forbidden_fields:
  - native_appwrite_tool_name
  - access_token
  - api_key
  - arbitrary_endpoint_url
  - caller_selected_policy
  - caller_selected_agent_role
validation:
  unknown_fields: REJECT
  unknown_tool: DENY_AND_AUDIT
  missing_identity: DENY_AND_AUDIT
  malformed_context: REJECT
