contract_id: appwrite-mcp-tool-registry
version: 1.1.0
status: CATALOG_CAPTURED
purpose: Map stable StoryGalore tool IDs to verified native Appwrite MCP tools or
  explicitly approved domain-operation adapters.
source_endpoint: mcp-server-appwrite (self-hosted, stdio transport)
official_documentation: https://appwrite.io/docs/advanced/self-hosting/mcp
provider_auth: scoped Appwrite project API key (APPWRITE_API_KEY + APPWRITE_PROJECT_ID + APPWRITE_ENDPOINT)
catalog_snapshot:
  captured_at_utc: 2026-10-22
  server_package: mcp-server-appwrite
  discovery_model: runtime
  status: CAPTURED
  core_mcp_tools:
  - appwrite_get_context
  - appwrite_search_tools
  - appwrite_call_tool
  - appwrite_search_docs
  service_enablement_flags:
    tablesdb: --tablesdb
    users: --users
    teams: --teams
    storage: --storage
    functions: --functions
    messaging: --messaging
    locale: --locale
    avatars: --avatars
    databases: --databases
    all: --all
  note: The full Appwrite tool catalog stays internal and is searched at runtime
    via appwrite_search_tools; it is not a static exported list. StoryGalore
    registers only the specific native tool names its allowlists require.
mappings:
  - storygalore_tool_id: stories.read
    native_tool: tables_db_get_row
    table: publications
  - storygalore_tool_id: story_plans.read
    native_tool: tables_db_get_row
    table: studio_story_bibles
  - storygalore_tool_id: media_metadata.read
    native_tool: tables_db_list_rows
    table: media_assets
  - storygalore_tool_id: community_reports.read_scoped
    native_tool: tables_db_list_rows
    table: reports
  - storygalore_tool_id: published_catalog.read
    native_tool: tables_db_list_rows
    table: publications
  - storygalore_tool_id: support_cases.read_scoped
    native_tool: tables_db_list_rows
    table: support_tickets
  - storygalore_tool_id: stories.create_draft
    api_operation: document_create
  - storygalore_tool_id: story_plans.create
    api_operation: story_bible_upsert
  - storygalore_tool_id: support_cases.update_scoped
    api_operation: admin_support_ticket_update
  - storygalore_tool_id: moderation.propose
    api_operation: comment_moderate
  - storygalore_tool_id: production_jobs.create_approved
    api_operation: generation_create
  - storygalore_tool_id: media_upload.initiate_approved
    api_operation: media_upload_initiate
  - storygalore_tool_id: agent_tasks.read
    api_operation: agent_task_list
  - storygalore_tool_id: agent_tasks.create
    api_operation: agent_task_create
  - storygalore_tool_id: agent_tasks.delegate_approved
    api_operation: agent_task_update
  - storygalore_tool_id: collections.create_draft
    api_operation: collection_create
mapping_rule: A StoryGalore tool id is mapped to a native Appwrite MCP tool only
  after its native name, schema, scopes, side effects, permissions and tests are
  registered in this file. Never infer native tool names from labels or examples;
  resolve them from the verified catalog via appwrite_search_tools at
  implementation time.
block_rule: No native Appwrite MCP tool may be exposed until its name, schema,
  scopes, side effects, permissions, and tests are registered here.
mutation_mapping_rule: Mutation StoryGalore tools (create/update/approve/delegate/
  execute/propose) are NOT mapped to raw tables_db write operations, which would
  bypass the `api` gateway's domain validation. They require explicitly approved
  domain-operation adapters that delegate to the canonical `api` function
  operations and stay fail-closed (UNREGISTERED_TOOL_MAPPING) until each adapter
  is registered with its idempotency, approval, and audit requirements.
runtime_note: The self-hosted mcp-server-appwrite is a Python process spawned by
  the Python gateway via `python -m mcp_server_appwrite` over stdio (mcp 2.x
  operator pattern (appwrite_call_tool). Mutations delegate to the api function.
unmapped_mutation_tools:
  art_briefs.create_draft: art-brief domain
  recommendations.propose: curation domain
  business_reports.create: business-reports domain
  reports.create: reports domain
  media_jobs.retry_approved: media-retry domain
  support_escalations.create: GitHub issue escalation
  contract_validation.run: deterministic validation (no side effect)
  release_readiness.report: deterministic report (no side effect)
  staging_operation.execute_approved: Cloudflare staging
  staging_resources.mutate_approved: Cloudflare staging
  imports.create: Keep2Share import domain
