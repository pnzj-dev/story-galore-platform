version: "1.0"
area: reader
commands:
  - name: reading_progress_upsert
    requiresAuthorization: true
    requiresIdempotency: true
    expectedRevision: optional
    emitsVersionedEvent: true
    sourceOfTruthWrite: true
  - name: reading_progress_complete
    requiresAuthorization: true
    requiresIdempotency: true
    expectedRevision: optional
    emitsVersionedEvent: true
    sourceOfTruthWrite: true
  - name: reader_preference_update
    requiresAuthorization: true
    requiresIdempotency: true
    expectedRevision: optional
    emitsVersionedEvent: true
    sourceOfTruthWrite: true
  - name: reader_session_resume
    requiresAuthorization: true
    requiresIdempotency: true
    expectedRevision: optional
    emitsVersionedEvent: true
    sourceOfTruthWrite: true
  - name: reader_session_close
    requiresAuthorization: true
    requiresIdempotency: true
    expectedRevision: optional
    emitsVersionedEvent: true
    sourceOfTruthWrite: true
queries:
  - name: reader_manifest_get
    authorizationFiltered: true
    secretsExcluded: true
    pagination: cursor_when_collection
  - name: reading_progress_get
    authorizationFiltered: true
    secretsExcluded: true
    pagination: cursor_when_collection
  - name: reader_preferences_get
    authorizationFiltered: true
    secretsExcluded: true
    pagination: cursor_when_collection
