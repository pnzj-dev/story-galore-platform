$schema: https://json-schema.org/draft/2020-12/schema
$id: storygalore://contracts/media/upload-progress/v1
title: Media Upload Progress
version: 1
type: object
additionalProperties: false
required: [uploadId, status, uploadedBytes, totalBytes, confirmedAt]
properties:
  uploadId: {type: string, minLength: 1}
  status: {enum: [CREATED, UPLOADING, PAUSED, RESUMING, COMPLETING, COMPLETED, FAILED, CANCELLED, EXPIRED]}
  uploadedBytes: {type: integer, minimum: 0}
  totalBytes: {type: integer, minimum: 1}
  confirmedChunkIndexes: {type: array, items: {type: integer, minimum: 0}, uniqueItems: true}
  nextSuggestedChunkIndex: {type: integer, minimum: 0}
  confirmedAt: {type: string, format: date-time}
