version: 1
kind: comment-contract
states: [VISIBLE, PENDING_REVIEW, HIDDEN, REMOVED]
operations:
  - create
  - edit
  - delete
  - reply
  - react
  - report
  - list
  - get
authorization:
  requires_authenticated_for_mutation: true
  requires_publication_access: true
  server_side_only: true
invariants:
  - comment_access_never_grants_publication_access
  - mutations_are_idempotent
  - moderation_state_is_server_authoritative
  - realtime_is_not_source_of_truth
