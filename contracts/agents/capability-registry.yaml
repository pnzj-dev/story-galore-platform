# StoryGalore agent capability registry.
#
# v1.1.0 - reconciled 2026-10-21. This is the complete, canonical capability
# set: every capability referenced by contracts/agents/tools/registry.yaml and
# the agent manifests is registered here with risk + scope.
#
# Changes from v1.0.0:
#   * Added 70 capabilities that were referenced by tools/manifests but missing.
#   * Removed 3 naming-duplicate entries superseded by the canonical names used
#     in tools/registry.yaml:
#         repository.pull_request.create -> github.pr.create
#         repository.pull_request.review -> github.pr.review
#         cost.budget.propose            -> budget.propose
#   * Reserved capabilities (registered for the risk model, not granted to any
#     V1 agent): agent.task.propose, deployment.production,
#     github.issue.create, github.issue.update, production.read,
#     production.mutate, economics.consumption.read,
#     economics.plan-profitability.read.
#   * Deny-by-default capabilities (scope: security) are the manifest
#     `capabilities.forbidden` set; no agent may ever hold them.
#
# risk:  LOW | MEDIUM | HIGH | CRITICAL
# scope: task | repository | deployment | support | github | analytics | cost |
#        economics | production | creative | trust | growth | user | business |
#        operations | executive | engineering | media-import | security
