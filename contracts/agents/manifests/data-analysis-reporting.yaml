schema: storygalore.agent-manifest/v1
id: sg.agent.data-analysis-reporting
slug: data-analysis-reporting
name: Data Analysis & Reporting Agent
release: V1
runtime:
  platform: CLOUDFLARE_AGENTS
  class_name: DataAnalysisReportingAgent
  state: PERSISTENT
execution:
  mode: ANALYZE
  decision_policy: AGENT_DECIDES_DETERMINISTIC_SYSTEM_AUTHORIZES
  unknown_requirement: BLOCKED
  provider_failure: BLOCKED_OR_RETRY_PER_CONTRACT
  never_invent_missing_contract: true
mission: Produces deterministic business, product, operations, cost and unit-economics
  analysis from authorized datasets.
trust_levels:
- NATIVE
- TRUSTED_EXTERNAL
- USER_CONNECTED
capabilities:
  allowed:
  - economics.consumer.read
  - economics.unit-economics.read
  - analytics.read
  - analytics.report.create
  - cost.read
  - report.schedule.propose
  - budget.propose
  - provider-health.read
  - usage.read
  forbidden:
  - admin.arbitrary-db-write
  - secret.read.plaintext
  - policy.bypass
  - entitlement.bypass
  - age-policy.bypass
  - moderation.bypass
  - production.deploy_without_approval
delegation:
  allowed_agents:
  - ceo
  - creator-business
  requires_policy_check: true
  scope_must_not_expand: true
  delegated_task_must_have_expiry: true
approvals:
  default: NONE
  high_risk: HUMAN_REQUIRED
  production: HUMAN_REQUIRED
  financial_mutation: HUMAN_REQUIRED
  delete_or_suspend: HUMAN_REQUIRED
context:
  include:
  - task
  - authorized_entities
  - relevant_contracts
  - current_operation
  exclude:
  - secrets
  - tokens
  - passwords
  - private_keys
  - unnecessary_pii
  - raw_payment_credentials
  minimize_data: true
state:
  authoritative_store: AgentSession/AgentTask
  realtime_not_source_of_truth: true
  idempotency_required: true
  operation_id_required_for_async: true
inputs:
  schema: contracts/agents/output-schemas/data-analysis-reporting-input.yaml
  reject_unknown_fields: true
outputs:
  schema: contracts/agents/output-schemas/data-analysis-reporting-output.yaml
  must_include_provenance: true
  must_include_policy_decision_id: true
tools:
  registry: contracts/agents/tools/registry.yaml
  allowed_tool_ids:
  - data-analysis-reporting.consumer-economics.read
  - data-analysis-reporting.unit-economics.read
  - data-analysis-reporting.analytics.read
  - data-analysis-reporting.analytics.report.create
  - data-analysis-reporting.cost.read
  - data-analysis-reporting.report.schedule.propose
tests:
  manifest: contracts/agents/test-matrix/data-analysis-reporting.yaml
  minimum:
  - contract
  - authorization
  - idempotency
  - failure
  - audit
implementation:
  source_owner: agent:data-analysis-reporting
  source_path: backend/cloudflare/agents/src/agents/data-analysis-reporting.ts
  tests_path: backend/cloudflare/agents/src/agents/data-analysis-reporting.test.ts
  route: /agents/data-analysis-reporting/:instanceId
