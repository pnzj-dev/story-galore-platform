schema: storygalore.agent-manifest/v1
id: sg.agent.keep2share-import
slug: keep2share-import
name: Keep2Share Import Agent
release: V1
runtime:
  platform: CLOUDFLARE_AGENTS
  class_name: Keep2ShareImportAgent
  state: PERSISTENT
execution:
  mode: EXECUTE
  decision_policy: AGENT_DECIDES_DETERMINISTIC_SYSTEM_AUTHORIZES
  unknown_requirement: BLOCKED
  provider_failure: BLOCKED_OR_RETRY_PER_CONTRACT
  never_invent_missing_contract: true
mission: Imports explicitly authorized Keep2Share files, normalizes metadata/archive
  members, verifies integrity/security and registers media through the canonical pipeline.
trust_levels:
- NATIVE
- TRUSTED_EXTERNAL
- USER_CONNECTED
capabilities:
  allowed:
  - import.request.read
  - keep2share.inspect
  - keep2share.authenticate
  - keep2share.download
  - media.metadata.normalize
  - archive.normalize
  - media.upload
  - media.register
  - moderation.submit
  forbidden:
  - admin.arbitrary-db-write
  - secret.read.plaintext
  - policy.bypass
  - entitlement.bypass
  - age-policy.bypass
  - moderation.bypass
  - production.deploy_without_approval
delegation:
  allowed_agents:
  - media-operations
  - support
  - orchestrator
  requires_policy_check: true
  scope_must_not_expand: true
  delegated_task_must_have_expiry: true
approvals:
  default: NONE
  high_risk: HUMAN_REQUIRED
  production: HUMAN_REQUIRED
  financial_mutation: HUMAN_REQUIRED
  delete_or_suspend: HUMAN_REQUIRED
context:
  include:
  - task
  - authorized_entities
  - relevant_contracts
  - current_operation
  exclude:
  - secrets
  - tokens
  - passwords
  - private_keys
  - unnecessary_pii
  - raw_payment_credentials
  minimize_data: true
state:
  authoritative_store: AgentSession/AgentTask
  realtime_not_source_of_truth: true
  idempotency_required: true
  operation_id_required_for_async: true
inputs:
  schema: contracts/agents/output-schemas/keep2share-import-input.yaml
  reject_unknown_fields: true
outputs:
  schema: contracts/agents/output-schemas/keep2share-import-output.yaml
  must_include_provenance: true
  must_include_policy_decision_id: true
tools:
  registry: contracts/agents/tools/registry.yaml
  allowed_tool_ids:
  - keep2share-import.import.request.read
  - keep2share-import.keep2share.inspect
  - keep2share-import.keep2share.authenticate
  - keep2share-import.keep2share.download
  - keep2share-import.media.metadata.normalize
  - keep2share-import.archive.normalize
  - keep2share-import.media.upload
  - keep2share-import.media.register
  - keep2share-import.moderation.submit
tests:
  manifest: contracts/agents/test-matrix/keep2share-import.yaml
  minimum:
  - contract
  - authorization
  - idempotency
  - failure
  - audit
implementation:
  source_owner: agent:keep2share-import
  source_path: backend/cloudflare/agents/src/agents/keep2share-import.ts
  tests_path: backend/cloudflare/agents/src/agents/keep2share-import.test.ts
  route: /agents/keep2share-import/:instanceId
