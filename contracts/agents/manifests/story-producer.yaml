schema: storygalore.agent-manifest/v1
id: sg.agent.story-producer
slug: story-producer
name: Story Producer Agent
release: V1
runtime:
  platform: CLOUDFLARE_AGENTS
  class_name: StoryProducerAgent
  state: PERSISTENT
execution:
  mode: ORCHESTRATE
  decision_policy: AGENT_DECIDES_DETERMINISTIC_SYSTEM_AUTHORIZES
  unknown_requirement: BLOCKED
  provider_failure: BLOCKED_OR_RETRY_PER_CONTRACT
  never_invent_missing_contract: true
mission: Front door for story intake; converts creator input into reviewable structured
  production plans, including character and world domain capabilities.
trust_levels:
- NATIVE
capabilities:
  allowed:
  - project.read
  - story-bible.read
  - story-bible.propose
  - character.propose
  - world.propose
  - production-plan.propose
  - agent.task.delegate
  - character.read
  - world.read
  forbidden:
  - admin.arbitrary-db-write
  - secret.read.plaintext
  - policy.bypass
  - entitlement.bypass
  - age-policy.bypass
  - moderation.bypass
  - production.deploy_without_approval
delegation:
  allowed_agents:
  - story-guardian
  - art-director
  - production
  requires_policy_check: true
  scope_must_not_expand: true
  delegated_task_must_have_expiry: true
approvals:
  default: NONE
  high_risk: HUMAN_REQUIRED
  production: HUMAN_REQUIRED
  financial_mutation: HUMAN_REQUIRED
  delete_or_suspend: HUMAN_REQUIRED
context:
  include:
  - task
  - authorized_entities
  - relevant_contracts
  - current_operation
  exclude:
  - secrets
  - tokens
  - passwords
  - private_keys
  - unnecessary_pii
  - raw_payment_credentials
  minimize_data: true
state:
  authoritative_store: AgentSession/AgentTask
  realtime_not_source_of_truth: true
  idempotency_required: true
  operation_id_required_for_async: true
inputs:
  schema: contracts/agents/output-schemas/story-producer-input.yaml
  reject_unknown_fields: true
outputs:
  schema: contracts/agents/output-schemas/story-producer-output.yaml
  must_include_provenance: true
  must_include_policy_decision_id: true
tools:
  registry: contracts/agents/tools/registry.yaml
  allowed_tool_ids:
  - story-producer.project.read
  - story-producer.story-bible.read
  - story-producer.story-bible.propose
  - story-producer.character.propose
  - story-producer.world.propose
  - story-producer.production-plan.propose
  - story-producer.agent.task.delegate
tests:
  manifest: contracts/agents/test-matrix/story-producer.yaml
  minimum:
  - contract
  - authorization
  - idempotency
  - failure
  - audit
implementation:
  source_owner: agent:story-producer
  source_path: packages/agents/story-producer
  tests_path: packages/agents/story-producer/tests
  route: /agents/story-producer/:instanceId
