schema: storygalore.agent-manifest/v1
id: sg.agent.orchestrator
slug: orchestrator
name: Agent Orchestrator
release: V1
runtime:
  platform: CLOUDFLARE_AGENTS
  class_name: OrchestratorAgent
  state: PERSISTENT
execution:
  mode: ORCHESTRATE
  decision_policy: AGENT_DECIDES_DETERMINISTIC_SYSTEM_AUTHORIZES
  unknown_requirement: BLOCKED
  provider_failure: BLOCKED_OR_RETRY_PER_CONTRACT
  never_invent_missing_contract: true
mission: Coordinates multi-agent tasks, delegation, approvals, budgets, dependencies
  and result synthesis.
trust_levels:
- NATIVE
capabilities:
  allowed:
  - agent.task.read
  - agent.task.delegate
  - agent.approval.request
  - agent.result.synthesize
  - cost.read
  forbidden:
  - admin.arbitrary-db-write
  - secret.read.plaintext
  - policy.bypass
  - entitlement.bypass
  - age-policy.bypass
  - moderation.bypass
  - production.deploy_without_approval
delegation:
  allowed_agents:
  - '*'
  requires_policy_check: true
  scope_must_not_expand: true
  delegated_task_must_have_expiry: true
approvals:
  default: NONE
  high_risk: HUMAN_REQUIRED
  production: HUMAN_REQUIRED
  financial_mutation: HUMAN_REQUIRED
  delete_or_suspend: HUMAN_REQUIRED
context:
  include:
  - task
  - authorized_entities
  - relevant_contracts
  - current_operation
  exclude:
  - secrets
  - tokens
  - passwords
  - private_keys
  - unnecessary_pii
  - raw_payment_credentials
  minimize_data: true
state:
  authoritative_store: AgentSession/AgentTask
  realtime_not_source_of_truth: true
  idempotency_required: true
  operation_id_required_for_async: true
inputs:
  schema: contracts/agents/output-schemas/orchestrator-input.yaml
  reject_unknown_fields: true
outputs:
  schema: contracts/agents/output-schemas/orchestrator-output.yaml
  must_include_provenance: true
  must_include_policy_decision_id: true
tools:
  registry: contracts/agents/tools/registry.yaml
  allowed_tool_ids:
  - orchestrator.agent.task.read
  - orchestrator.agent.task.delegate
  - orchestrator.agent.approval.request
  - orchestrator.agent.result.synthesize
  - orchestrator.cost.read
tests:
  manifest: contracts/agents/test-matrix/orchestrator.yaml
  minimum:
  - contract
  - authorization
  - idempotency
  - failure
  - audit
implementation:
  source_owner: agent:orchestrator
  source_path: packages/agents/orchestrator
  tests_path: packages/agents/orchestrator/tests
  route: /agents/orchestrator/:instanceId
