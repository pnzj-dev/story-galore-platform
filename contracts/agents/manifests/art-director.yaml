schema: storygalore.agent-manifest/v1
id: sg.agent.art-director
slug: art-director
name: Art Director Agent
release: V1
runtime:
  platform: CLOUDFLARE_AGENTS
  class_name: ArtDirectorAgent
  state: PERSISTENT
execution:
  mode: PROPOSE
  decision_policy: AGENT_DECIDES_DETERMINISTIC_SYSTEM_AUTHORIZES
  unknown_requirement: BLOCKED
  provider_failure: BLOCKED_OR_RETRY_PER_CONTRACT
  never_invent_missing_contract: true
mission: Converts approved story/style intent into visual direction, references, prompt
  plans and art-production constraints.
trust_levels:
- NATIVE
capabilities:
  allowed:
  - story-bible.read
  - character.read
  - world.read
  - style.read
  - visual-plan.propose
  forbidden:
  - admin.arbitrary-db-write
  - secret.read.plaintext
  - policy.bypass
  - entitlement.bypass
  - age-policy.bypass
  - moderation.bypass
  - production.deploy_without_approval
delegation:
  allowed_agents:
  - story-producer
  - production
  requires_policy_check: true
  scope_must_not_expand: true
  delegated_task_must_have_expiry: true
approvals:
  default: NONE
  high_risk: HUMAN_REQUIRED
  production: HUMAN_REQUIRED
  financial_mutation: HUMAN_REQUIRED
  delete_or_suspend: HUMAN_REQUIRED
context:
  include:
  - task
  - authorized_entities
  - relevant_contracts
  - current_operation
  exclude:
  - secrets
  - tokens
  - passwords
  - private_keys
  - unnecessary_pii
  - raw_payment_credentials
  minimize_data: true
state:
  authoritative_store: AgentSession/AgentTask
  realtime_not_source_of_truth: true
  idempotency_required: true
  operation_id_required_for_async: true
inputs:
  schema: contracts/agents/output-schemas/art-director-input.yaml
  reject_unknown_fields: true
outputs:
  schema: contracts/agents/output-schemas/art-director-output.yaml
  must_include_provenance: true
  must_include_policy_decision_id: true
tools:
  registry: contracts/agents/tools/registry.yaml
  allowed_tool_ids:
  - art-director.story-bible.read
  - art-director.character.read
  - art-director.world.read
  - art-director.style.read
  - art-director.visual-plan.propose
tests:
  manifest: contracts/agents/test-matrix/art-director.yaml
  minimum:
  - contract
  - authorization
  - idempotency
  - failure
  - audit
implementation:
  source_owner: agent:art-director
  source_path: backend/cloudflare/agents/src/agents/art-director.ts
  tests_path: backend/cloudflare/agents/src/agents/art-director.test.ts
  route: /agents/art-director/:instanceId
