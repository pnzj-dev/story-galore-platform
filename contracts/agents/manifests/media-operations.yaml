schema: storygalore.agent-manifest/v1
id: sg.agent.media-operations
slug: media-operations
name: Media Operations Agent
release: V1
runtime:
  platform: CLOUDFLARE_AGENTS
  class_name: MediaOperationsAgent
  state: PERSISTENT
execution:
  mode: EXECUTE
  decision_policy: AGENT_DECIDES_DETERMINISTIC_SYSTEM_AUTHORIZES
  unknown_requirement: BLOCKED
  provider_failure: BLOCKED_OR_RETRY_PER_CONTRACT
  never_invent_missing_contract: true
mission: Manages media processing, distribution health, metadata quality and media
  operational recovery.
trust_levels:
- NATIVE
capabilities:
  allowed:
  - economics.media-cost.read
  - media.read
  - media.mutate
  - distribution.read
  - distribution.repair
  - metadata.normalize
  forbidden:
  - admin.arbitrary-db-write
  - secret.read.plaintext
  - policy.bypass
  - entitlement.bypass
  - age-policy.bypass
  - moderation.bypass
  - production.deploy_without_approval
delegation:
  allowed_agents:
  - production
  - infrastructure
  requires_policy_check: true
  scope_must_not_expand: true
  delegated_task_must_have_expiry: true
approvals:
  default: NONE
  high_risk: HUMAN_REQUIRED
  production: HUMAN_REQUIRED
  financial_mutation: HUMAN_REQUIRED
  delete_or_suspend: HUMAN_REQUIRED
context:
  include:
  - task
  - authorized_entities
  - relevant_contracts
  - current_operation
  exclude:
  - secrets
  - tokens
  - passwords
  - private_keys
  - unnecessary_pii
  - raw_payment_credentials
  minimize_data: true
state:
  authoritative_store: AgentSession/AgentTask
  realtime_not_source_of_truth: true
  idempotency_required: true
  operation_id_required_for_async: true
inputs:
  schema: contracts/agents/output-schemas/media-operations-input.yaml
  reject_unknown_fields: true
outputs:
  schema: contracts/agents/output-schemas/media-operations-output.yaml
  must_include_provenance: true
  must_include_policy_decision_id: true
tools:
  registry: contracts/agents/tools/registry.yaml
  allowed_tool_ids:
  - media-operations.delivery-economics.read
  - media-operations.media.read
  - media-operations.media.mutate
  - media-operations.distribution.read
  - media-operations.distribution.repair
  - media-operations.metadata.normalize
tests:
  manifest: contracts/agents/test-matrix/media-operations.yaml
  minimum:
  - contract
  - authorization
  - idempotency
  - failure
  - audit
implementation:
  source_owner: agent:media-operations
  source_path: backend/cloudflare/agents/src/agents/media-operations.ts
  tests_path: backend/cloudflare/agents/src/agents/media-operations.test.ts
  route: /agents/media-operations/:instanceId
