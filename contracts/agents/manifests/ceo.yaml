schema: storygalore.agent-manifest/v1
id: sg.agent.ceo
slug: ceo
name: CEO Agent
release: V1
runtime:
  platform: CLOUDFLARE_AGENTS
  class_name: CeoAgent
  state: PERSISTENT
execution:
  mode: ADVISE
  decision_policy: AGENT_DECIDES_DETERMINISTIC_SYSTEM_AUTHORIZES
  unknown_requirement: BLOCKED
  provider_failure: BLOCKED_OR_RETRY_PER_CONTRACT
  never_invent_missing_contract: true
mission: Provides executive reporting, priorities, risks and scenarios; cannot self-authorize
  production changes.
trust_levels:
- NATIVE
- TRUSTED_EXTERNAL
- USER_CONNECTED
capabilities:
  allowed:
  - economics.consumer.read
  - analytics.read
  - cost.read
  - revenue.read
  - support.read
  - executive.propose
  forbidden:
  - admin.arbitrary-db-write
  - secret.read.plaintext
  - policy.bypass
  - entitlement.bypass
  - age-policy.bypass
  - moderation.bypass
  - production.deploy_without_approval
delegation:
  allowed_agents:
  - data-analysis-reporting
  - creator-business
  requires_policy_check: true
  scope_must_not_expand: true
  delegated_task_must_have_expiry: true
approvals:
  default: NONE
  high_risk: HUMAN_REQUIRED
  production: HUMAN_REQUIRED
  financial_mutation: HUMAN_REQUIRED
  delete_or_suspend: HUMAN_REQUIRED
context:
  include:
  - task
  - authorized_entities
  - relevant_contracts
  - current_operation
  exclude:
  - secrets
  - tokens
  - passwords
  - private_keys
  - unnecessary_pii
  - raw_payment_credentials
  minimize_data: true
state:
  authoritative_store: AgentSession/AgentTask
  realtime_not_source_of_truth: true
  idempotency_required: true
  operation_id_required_for_async: true
inputs:
  schema: contracts/agents/output-schemas/ceo-input.yaml
  reject_unknown_fields: true
outputs:
  schema: contracts/agents/output-schemas/ceo-output.yaml
  must_include_provenance: true
  must_include_policy_decision_id: true
tools:
  registry: contracts/agents/tools/registry.yaml
  allowed_tool_ids:
  - ceo.economics.summary.read
  - ceo.analytics.read
  - ceo.cost.read
  - ceo.revenue.read
  - ceo.support.read
  - ceo.executive.propose
tests:
  manifest: contracts/agents/test-matrix/ceo.yaml
  minimum:
  - contract
  - authorization
  - idempotency
  - failure
  - audit
implementation:
  source_owner: agent:ceo
  source_path: backend/cloudflare/agents/src/agents/ceo.ts
  tests_path: backend/cloudflare/agents/src/agents/ceo.test.ts
  route: /agents/ceo/:instanceId
