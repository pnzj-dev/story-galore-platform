schema: storygalore.agent-manifest/v1
id: sg.agent.qa-release
slug: qa-release
name: QA / Release Agent
release: V1
runtime:
  platform: CLOUDFLARE_AGENTS
  class_name: QaReleaseAgent
  state: PERSISTENT
execution:
  mode: VERIFY
  decision_policy: AGENT_DECIDES_DETERMINISTIC_SYSTEM_AUTHORIZES
  unknown_requirement: BLOCKED
  provider_failure: BLOCKED_OR_RETRY_PER_CONTRACT
  never_invent_missing_contract: true
mission: Runs deterministic validation, regression analysis, release readiness and
  deployment evidence checks.
trust_levels:
- NATIVE
capabilities:
  allowed:
  - repository.read
  - ci.run
  - contract.validate
  - security.validate
  - release.verify
  - github.pr.review
  forbidden:
  - admin.arbitrary-db-write
  - secret.read.plaintext
  - policy.bypass
  - entitlement.bypass
  - age-policy.bypass
  - moderation.bypass
  - production.deploy_without_approval
delegation:
  allowed_agents:
  - coding-dev
  - infrastructure
  - orchestrator
  requires_policy_check: true
  scope_must_not_expand: true
  delegated_task_must_have_expiry: true
approvals:
  default: NONE
  high_risk: HUMAN_REQUIRED
  production: HUMAN_REQUIRED
  financial_mutation: HUMAN_REQUIRED
  delete_or_suspend: HUMAN_REQUIRED
context:
  include:
  - task
  - authorized_entities
  - relevant_contracts
  - current_operation
  exclude:
  - secrets
  - tokens
  - passwords
  - private_keys
  - unnecessary_pii
  - raw_payment_credentials
  minimize_data: true
state:
  authoritative_store: AgentSession/AgentTask
  realtime_not_source_of_truth: true
  idempotency_required: true
  operation_id_required_for_async: true
inputs:
  schema: contracts/agents/output-schemas/qa-release-input.yaml
  reject_unknown_fields: true
outputs:
  schema: contracts/agents/output-schemas/qa-release-output.yaml
  must_include_provenance: true
  must_include_policy_decision_id: true
tools:
  registry: contracts/agents/tools/registry.yaml
  allowed_tool_ids:
  - qa-release.repository.read
  - qa-release.ci.run
  - qa-release.contract.validate
  - qa-release.security.validate
  - qa-release.release.verify
  - qa-release.github.pr.review
tests:
  manifest: contracts/agents/test-matrix/qa-release.yaml
  minimum:
  - contract
  - authorization
  - idempotency
  - failure
  - audit
implementation:
  source_owner: agent:qa-release
  source_path: backend/cloudflare/agents/src/agents/qa-release.ts
  tests_path: backend/cloudflare/agents/src/agents/qa-release.test.ts
  route: /agents/qa-release/:instanceId
