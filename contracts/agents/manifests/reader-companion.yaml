schema: storygalore.agent-manifest/v1
id: sg.agent.reader-companion
slug: reader-companion
name: Reader Companion Agent
release: V1
runtime:
  platform: CLOUDFLARE_AGENTS
  class_name: ReaderCompanionAgent
  state: PERSISTENT
execution:
  mode: ASSIST
  decision_policy: AGENT_DECIDES_DETERMINISTIC_SYSTEM_AUTHORIZES
  unknown_requirement: BLOCKED
  provider_failure: BLOCKED_OR_RETRY_PER_CONTRACT
  never_invent_missing_contract: true
mission: Provides reader-facing assistance without bypassing entitlement, age, jurisdiction
  or content policy.
trust_levels:
- NATIVE
- TRUSTED_EXTERNAL
- USER_CONNECTED
capabilities:
  allowed:
  - reader.read
  - publication.read
  - entitlement.read
  - reader.assist
  forbidden:
  - admin.arbitrary-db-write
  - secret.read.plaintext
  - policy.bypass
  - entitlement.bypass
  - age-policy.bypass
  - moderation.bypass
  - production.deploy_without_approval
delegation:
  allowed_agents:
  - support
  requires_policy_check: true
  scope_must_not_expand: true
  delegated_task_must_have_expiry: true
approvals:
  default: NONE
  high_risk: HUMAN_REQUIRED
  production: HUMAN_REQUIRED
  financial_mutation: HUMAN_REQUIRED
  delete_or_suspend: HUMAN_REQUIRED
context:
  include:
  - task
  - authorized_entities
  - relevant_contracts
  - current_operation
  exclude:
  - secrets
  - tokens
  - passwords
  - private_keys
  - unnecessary_pii
  - raw_payment_credentials
  minimize_data: true
state:
  authoritative_store: AgentSession/AgentTask
  realtime_not_source_of_truth: true
  idempotency_required: true
  operation_id_required_for_async: true
inputs:
  schema: contracts/agents/output-schemas/reader-companion-input.yaml
  reject_unknown_fields: true
outputs:
  schema: contracts/agents/output-schemas/reader-companion-output.yaml
  must_include_provenance: true
  must_include_policy_decision_id: true
tools:
  registry: contracts/agents/tools/registry.yaml
  allowed_tool_ids:
  - reader-companion.reader.read
  - reader-companion.publication.read
  - reader-companion.entitlement.read
  - reader-companion.reader.assist
tests:
  manifest: contracts/agents/test-matrix/reader-companion.yaml
  minimum:
  - contract
  - authorization
  - idempotency
  - failure
  - audit
implementation:
  source_owner: agent:reader-companion
  source_path: packages/agents/reader-companion
  tests_path: packages/agents/reader-companion/tests
  route: /agents/reader-companion/:instanceId
