  release: V1
  runtime: CLOUDFLARE_AGENT
  trust_levels_allowed:
  - NATIVE
  - TRUSTED_EXTERNAL
  - USER_CONNECTED
  approval_class: HUMAN_REQUIRED_FOR_HIGH_RISK
  manifest: agents/ceo/manifest.yaml
- id: sg.agent.data-analysis-reporting
