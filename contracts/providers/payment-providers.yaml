schema: storygalore.payment-provider-registry/v1
version: 1
category: payments
policy: fail_closed
providers:
- providerId: STRIPE
  status: CONDITIONAL
  adapterRef: services/payments/adapters/stripe
  capabilities:
  - oneTimePayments
  - nativeSubscriptions
  - recurringPayments
  - refunds
  - webhooks
  - creatorPayouts
  - stablecoinPayouts
  nativeSubscriptionModel: autoChargeSavedMethod
  activationRequires:
  - currentProviderContractVerification
  - StoryGaloreBusinessModelApproval
  - jurisdictionApproval
  - adultAiUgcApprovalIfApplicable
- providerId: NOWPAYMENTS
  status: CONDITIONAL
  adapterRef: services/payments/adapters/nowpayments
  capabilities:
  - oneTimeCryptoPayments
  - nativeSubscriptions
  - cryptoPayouts
  - webhooks
  nativeSubscriptionModel: emailOrCustodial
  activationRequires:
  - currentProviderContractVerification
  - jurisdictionApproval
  - businessModelApproval
statusSemantics:
  CONDITIONAL: Adapter may be implemented/tested but MUST NOT be production-routable until activation requirements pass.
  ACTIVE: Production-routable after human approval.
  SUSPENDED: Not routable; existing transactions reconcile only.
