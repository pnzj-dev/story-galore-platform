schema: storygalore.api-registry/v1
version: 1
release: V19.5
policy: deterministic
route_source: contracts/ui/pages/page-registry.yaml
rules:
  - Every HTTP endpoint MUST have exactly one registry entry.
  - Every registry entry MUST declare auth, capability, request, response, errors, rate limit, idempotency, persistence, events and cache policy.
  - Unknown endpoints are BLOCKED.
  - Undeclared methods are BLOCKED.
  - Client-visible errors MUST use the shared error catalog.
  - API handlers MUST delegate domain behavior to canonical commands/queries.
  - API handlers MUST NOT contain alternate business state machines.
entry_schema:
  - id
  - method
  - path
  - actor
  - capability
  - request_schema
  - response_schema
  - errors
  - idempotency
  - rate_limit
  - persistence
  - events
  - cache_policy
  - audit
  - implementation_owner
