      - {id: GAME_WALKTHROUGH, label: Game walkthrough, maps_to: POST, status: proposed_requires_game_reference_and_step_schema}
      - {id: GAME_MOD, label: Game mod, maps_to: null, status: blocked_until_game_mod_rights_and_asset_contract_approved}
  mapping_rules:
    - Existing persistence mapping is allowed only when the referenced schema supports the archetype's required fields and lifecycle.
    - A candidate maps_to value is not proof that the archetype is implemented or publishable.
    - Where a mapping is conditional, UI must not expose the archetype as available until its condition is verified.
    - New persistence types require all gates listed in persistence_enum_policy.adding_enum_value_requires.
    - Categories and genres remain separate from publication archetypes; for example HORROR is a genre, not a publication type.

existing_publication_types:
  status: proposed_canonical_model_requires_migration_approval
  values:
    - id: BOOK
      canonical: true
      purpose: A published work with a registered format/content structure, including prose books and sequential visual formats such as comics, manga, manhwa, and webtoons where supported.
      formats_are_not_publication_types: true
      format_contracts:
        document_schema: contracts/studio/document.schema.yaml
        generic_book_content_model: BLOCKED_UNTIL_APPROVED
    - id: POST
      canonical: true
      purpose: Editorial or textual publication using the registered post body and metadata contract; not a generic fallback.
    - id: VIDEO
      canonical: true
      purpose: Publication whose primary consumption experience is video playback.
    - id: AUDIO
      canonical: true
      purpose: Publication whose primary consumption experience is audio playback.
    - id: MIXED
      canonical: true
      purpose: Publication composed of explicitly ordered heterogeneous content blocks or referenced media.
  non_publication_concepts:
    - id: IMAGE_GALLERY
      kind: presentation_mode
      purpose: Render a registered collection of IMAGE assets as a gallery; does not create a Publication.type value.
      collection_storage_contract: BLOCKED_UNTIL_COLLECTION_MODEL_APPROVED
    - id: COMIC
      kind: BOOK_format
      purpose: Sequential visual narrative format; page ordering and reading semantics are part of BOOK content structure, not Publication.type.
  migration_policy:
    existing_COMIC_publications: map_to_BOOK_with_format_COMIC_only_after_data_audit
    existing_IMAGE_GALLERY_publications: map_to_registered_collection_or_MIXED_only_after_data_audit; otherwise BLOCK
    automatic_data_rewrite: forbidden
    required_gates: [inventory_existing_data, domain_model_contract, schema_migration, API_contract, lifecycle_contract, authorization_contract, analytics_mapping, UI_and_accessibility_contract, migration_and_rollback_plan, explicit_approval]

existing_media_asset_types:
  canonical: true
  values: [IMAGE, VIDEO, AUDIO, DOCUMENT]
  semantics:
    IMAGE: Image file or rendition; may be used as a cover, thumbnail, gallery item, illustration, or comic page.
    VIDEO: Video file or rendition.
    AUDIO: Audio file or rendition.
    DOCUMENT: Document file or rendition.
  rejected_unknown_type: true
  comic_page_representation:
    asset_type: IMAGE
    page_order_and_reading_semantics_owner: BOOK_format_COMIC_content_structure
    separate_asset_type: false

category_and_genre_policy:
  storage: registered_data_driven_taxonomy
  hierarchy: [catalog_family, category, optional_subcategory, zero_or_more_genres, optional_tags]
  semantics:
    catalog_family: top-level discovery surface such as GAMES, BOOKS, VIDEOS, AUDIO, IMAGES
    category: registered domain classification within a catalog family; for Games, GAME is the root classification
    subcategory: more specific entity/form classification; for Games examples include VIDEO_GAME, BROWSER_GAME, TABLETOP_GAME, BOARD_GAME, CARD_GAME, INTERACTIVE_FICTION
    genre: one or more subject, narrative, stylistic or gameplay classifications; for Games examples include RPG, STRATEGY, HORROR, PUZZLE, SIMULATION
    platform: separate compatibility dimension, never a genre or subcategory by inference
    format: separate content/build structure such as COMIC, WEB_WASM, WEBGL or EPUB; not a genre
    media_asset_type: stored resource modality and independent from category/genre
  examples_are_exhaustive: false
  allow_multiple_genres: true
  genre_scope: domain_scoped_registered_taxonomy
  unknown_category: BLOCK_OR_SAFE_UNCLASSIFIED_STATE; never silently coerce
  category_mutation: requires_authorized_registered_taxonomy_command
  localization: registered_translation_keys; never use labels as stable identifiers
  restricted_categories: enforce_legal_age_visibility_entitlement_and_moderation_contracts

artwork_policy:
  canonical_artwork_contract: contracts/ui/artwork.yaml
  preserve_aspect_ratio: true
  portrait_cover_required_for_catalog_cards: true
  exceptions: media_specific_landscape_or_square_artwork_may_also_be_used
  missing_artwork: registered_fallback_component
  type_icon: use_registered_media_type_icon; never rely on color alone

ui_contract:
  canonical_type_registry: this_file
  route_registry: contracts/ui/pages/page-registry.yaml
  design_must_distinguish_catalog_type_from_publication_type: true
  disabled_or_unavailable_capabilities_must_be_visible_as_unavailable_or_omitted: true
  no_fake_player_reader_or_game_launch_actions: true

approval_blockers:
  - id: MEDIA_BOOK_CONTENT_MODEL
    decision: Whether to add a first-class book/ebook publication structure for novels and non-comic books.
  - id: MEDIA_SHORTS_THRESHOLD
    decision: Exact registered duration/orientation rule that qualifies a video for Shorts discovery.
  - id: MEDIA_GAME_RUNTIME_RELEASE
    decision: Production release gates, supported build targets, isolated hosting origin, runtime resource limits, network policy, and operational rollback for StoryGalore-hosted browser games.
  - id: MEDIA_AUDIOBOOK_PODCAST_MODEL
    decision: Chapter/episode/series structures and supported playback capabilities.
  - id: MEDIA_TAXONOMY_GOVERNANCE
    decision: Authorized taxonomy mutation commands, review workflow, and category retirement behavior.
