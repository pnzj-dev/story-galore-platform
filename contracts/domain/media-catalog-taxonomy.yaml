      - {id: BUNDLE, label: Bundle, maps_to: MIXED, status: proposed_requires_bundle_entitlement_and_commerce_contract}
      - {id: SERIES_LANDING_PAGE, label: Series landing page, maps_to: POST, status: proposed_requires_series_projection_contract}
