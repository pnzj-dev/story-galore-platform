schema: storygalore.media-catalog-taxonomy/v1
version: 1
canonical: true
purpose: >-
  Separate user-facing catalog types from publication persistence types, media asset types,
  formats/capabilities, and extensible categories/genres. This contract does not assert that
  every catalog type is currently ingestible, publishable, streamable, or playable.

invariants:
  user_facing_media_type_is_not_publication_type: true
  user_facing_media_type_is_not_asset_type: true
  format_and_capability_are_properties_not_new_persistence_types: true
  categories_and_genres_are_data_driven: true
  unknown_type_or_category_must_not_be_silently_reclassified: true
  unsupported_capability_must_not_be_rendered_as_available: true
  taxonomy_changes_require_registered_contract_change: true

user_facing_media_types:
  - id: VIDEOS
    label: Videos
    status: supported_schema_phased_product_exposure
    description: Video publications and catalog entries; actual publication exposure remains feature-gated.
    publication_type_mapping: [VIDEO]
    asset_type_mapping: [VIDEO]
    formats:
      - id: MOVIE
        status: catalog_subtype
      - id: TV_SHOW
        status: catalog_subtype
      - id: NEWS
        status: catalog_subtype
      - id: DOCUMENTARY
        status: catalog_subtype
      - id: ANIME
        status: catalog_subtype
      - id: ANIMATION
        status: catalog_subtype
      - id: SHORT_FILM
        status: catalog_subtype
    properties:
      orientation: [PORTRAIT, LANDSCAPE, SQUARE, UNKNOWN]
      durationClass: [SHORT, MEDIUM, LONG]
    presentation:
      artwork: [LANDSCAPE_THUMBNAIL, PORTRAIT_POSTER_WHEN_AVAILABLE]
      experience: [DETAIL, PLAYER_WHEN_ENABLED, RELATED_CONTENT]
  - id: SHORTS
    label: Shorts
    status: derived_catalog_view
    description: A short-form discovery and viewing surface over VIDEO assets/publications; not a new persistence type.
    publication_type_mapping: [VIDEO]
    asset_type_mapping: [VIDEO]
    derivation:
      source_type: VIDEO
      required_properties: [durationClass]
      duration_threshold: BLOCKED_UNTIL_PRODUCT_CONTRACT_APPROVED
      orientation_preference: PORTRAIT
    formats:
      - id: COMEDY
        status: category_example
      - id: ENTERTAINMENT
        status: category_example
      - id: EDUCATION
        status: category_example
      - id: GAMING
        status: category_example
      - id: MUSIC
        status: category_example
      - id: LIFESTYLE
        status: category_example
      - id: ANIMATION
        status: category_example
    presentation:
      artwork: [PORTRAIT_THUMBNAIL]
      experience: [VERTICAL_FEED_WHEN_ENABLED]
  - id: BOOKS
    label: Books
    status: partially_mapped_capability_gated
    description: User-facing book catalog backed by the canonical BOOK publication type; concrete book formats remain capability-gated by their content contracts.
    publication_type_mapping:
      - publication_type: BOOK
        scope: all book formats only when the registered format/content structure contract allows
    asset_type_mapping: [IMAGE, DOCUMENT]
    mapping_rule: BOOK is the canonical publication type; each format requires an approved content structure and lifecycle before it is enabled.
    formats:
      - id: NOVEL
        status: proposed_catalog_category_requires_content_model_contract
      - id: COMIC
        status: existing_comic_format_contract_mapping
      - id: MANGA
        status: existing_format_guidance
      - id: MANHWA
        status: existing_format_guidance
      - id: MANHUA
        status: proposed_catalog_category_requires_format_contract
      - id: BANDE_DESSINEE
        status: existing_format_guidance
      - id: GRAPHIC_NOVEL
        status: existing_comic_format_contract_mapping
      - id: WEBTOON
        status: existing_format_guidance
      - id: LIGHT_NOVEL
        status: proposed_catalog_category_requires_format_contract
      - id: NONFICTION
        status: proposed_catalog_category_requires_content_model_contract
      - id: EDUCATIONAL
        status: proposed_catalog_category_requires_content_model_contract
    presentation:
      artwork: [PORTRAIT_COVER]
      experience: [COMIC_READER_WHEN_FORMAT_SUPPORTED, TEXT_READER_ONLY_WHEN_REGISTERED]
  - id: IMAGES
    label: Images
    status: supported_for_image_and_gallery_content
    description: Image assets and catalog collections. Gallery is a presentation/layout mode, not a persisted publication type; an image asset or collection is not automatically a publication.
    publication_type_mapping: []
    asset_type_mapping: [IMAGE]
    formats:
      - id: ILLUSTRATION
        status: category_example
      - id: PHOTOGRAPHY
        status: category_example
      - id: DIGITAL_ART
        status: category_example
      - id: FAN_ART
        status: category_example
      - id: COMICS_AND_VISUAL_COLLECTIONS
        status: category_example
      - id: ADULT
        status: blocked_until_legal_age_access_and_policy_contracts_allow
      - id: HENTAI
        status: blocked_until_legal_age_access_and_policy_contracts_allow
    presentation:
      artwork: [IMAGE_THUMBNAIL, GALLERY_COVER]
      experience: [GALLERY, LIGHTBOX_WHEN_ENABLED]
  - id: AUDIO
    label: Audio
    status: schema_supported_product_exposure_phased
    description: Audio publications and assets; availability depends on registered ingestion and playback capability.
    publication_type_mapping: [AUDIO]
    asset_type_mapping: [AUDIO]
    formats:
      - id: AUDIOBOOK
        status: proposed_catalog_category_requires_audio_chapter_content_contract
      - id: MUSIC
        status: catalog_category
      - id: PODCAST
        status: proposed_catalog_category_requires_episode_content_contract
      - id: SPOKEN_WORD
        status: catalog_category
    presentation:
      artwork: [SQUARE_COVER]
      experience: [PLAYER_WHEN_ENABLED, PERSISTENT_MINI_PLAYER_WHEN_SUPPORTED]
  - id: GAMES
    label: Games
    status: catalog_entity_contract_defined_playable_builds_release_gated
    description: First-class game catalog entries, separate from Publication and MediaAsset. Browser-playable builds are hosted by StoryGalore only after review and release approval.
    publication_type_mapping: []
    asset_type_mapping: [IMAGE, VIDEO, AUDIO, DOCUMENT]
    catalog_entity: contracts/domain/game-catalog.schema.yaml
    game_build_contract: contracts/domain/game-build.schema.yaml
    game_classification:
      category: GAME
      subcategory_examples: [VIDEO_GAME, BROWSER_GAME, TABLETOP_GAME, BOARD_GAME, CARD_GAME, INTERACTIVE_FICTION]
      genre_examples: [ACTION, ADVENTURE, RPG, STRATEGY, SIMULATION, PUZZLE, RACING, SPORTS, PLATFORMER, TACTICAL, SURVIVAL, HORROR, RHYTHM, SANDBOX, PARTY, EDUCATIONAL]
      genres_are_multi_valued: true
      genre_scope: domain_scoped_data_driven_taxonomy
    playable_in_browser:
      default: false
      hosting_model: STORYGALORE_HOSTED_ISOLATED_GAME_RUNTIME
      accepted_build_targets: [WEB_WASM, WEBGL, HTML5_WEB_BUNDLE]
      allowed_only_when: [registered_game_build, malware_and_policy_review_passed, rights_confirmed, explicit_playable_capability, authorization_contract, isolated_origin_policy, runtime_health, release_approval]
      execution_security_contract: contracts/domain/game-build.schema.yaml
      external_iframe_or_external_url_is_not_equivalent_to_platform_hosting: true
    presentation:
      artwork: [PORTRAIT_COVER, LANDSCAPE_SCREENSHOT]
      experience: [CATALOG_DETAIL, PLAY_ONLY_WHEN_BUILD_IS_APPROVED_AND_RUNTIME_HEALTHY]

publication_archetype_registry:
  canonical: true
  purpose: >-
    Extensive product-level registry of publication forms users may browse, create, or consume.
    Archetypes are not automatically new Publication.type enum values. Each entry explicitly maps
    to an existing persistence type only where a current contract permits it; otherwise it remains
    proposed and blocked until a content-model, API, lifecycle, permissions, analytics, and UI contract
    is approved.
  persistence_enum_policy:
    existing_enum_is_unchanged: false
    canonical_enum_after_approval: [BOOK, POST, VIDEO, AUDIO, MIXED]
    removed_as_publication_types: [COMIC, IMAGE_GALLERY]
    migration_status: BLOCKED_UNTIL_SCHEMA_API_DATA_MIGRATION_AND_ROLLBACK_APPROVED
    adding_enum_value_requires: [domain_model_contract, schema_migration, API_contract, lifecycle_contract, authorization_contract, analytics_mapping, UI_and_accessibility_contract, migration_and_rollback_plan]
    archetype_label_is_not_stable_identifier: true
    unknown_archetype: BLOCK
  groups:
    editorial_and_community:
      - {id: ARTICLE, label: Article, maps_to: POST, status: only_if_post_contract_supports_body_and_metadata}
      - {id: BLOG_POST, label: Blog post, maps_to: POST, status: only_if_post_contract_supports_body_and_metadata}
      - {id: NEWS_ARTICLE, label: News article, maps_to: POST, status: proposed_requires_editorial_metadata_contract}
      - {id: REVIEW, label: Review, maps_to: POST, status: proposed_requires_review_schema_and_rating_policy}
      - {id: INTERVIEW, label: Interview, maps_to: POST, status: proposed_requires_interview_structure}
      - {id: ESSAY, label: Essay, maps_to: POST, status: only_if_post_contract_supports_long_form_text}
      - {id: EDITORIAL, label: Editorial, maps_to: POST, status: proposed_requires_editorial_policy}
      - {id: OP_ED, label: Opinion piece, maps_to: POST, status: proposed_requires_editorial_policy}
      - {id: RESEARCH_PAPER, label: Research paper, maps_to: POST, status: proposed_requires_document_citation_and_versioning_contract}
      - {id: WHITE_PAPER, label: White paper, maps_to: POST, status: proposed_requires_document_contract}
      - {id: REPORT, label: Report, maps_to: POST, status: proposed_requires_document_contract}
      - {id: CASE_STUDY, label: Case study, maps_to: POST, status: proposed_requires_document_contract}
      - {id: PRESS_RELEASE, label: Press release, maps_to: POST, status: proposed_requires_editorial_metadata_contract}
      - {id: ANNOUNCEMENT, label: Announcement, maps_to: POST, status: only_if_post_contract_supports_announcement_visibility}
      - {id: NEWSLETTER, label: Newsletter, maps_to: POST, status: proposed_requires_subscription_and_delivery_contract}
      - {id: FAQ, label: FAQ, maps_to: POST, status: proposed_requires_structured_question_answer_contract}
      - {id: KNOWLEDGE_BASE_ARTICLE, label: Knowledge-base article, maps_to: POST, status: proposed_requires_versioning_and_search_contract}
      - {id: DEVLOG, label: Development log, maps_to: POST, status: only_if_post_contract_supports_chronological_entries}
      - {id: PATCH_NOTES, label: Patch notes, maps_to: POST, status: proposed_requires_versioned_release_notes_contract}
      - {id: JOURNAL_ENTRY, label: Journal entry, maps_to: POST, status: proposed_requires_private_public_visibility_contract}
      - {id: LISTICLE, label: List article, maps_to: POST, status: only_if_post_contract_supports_structured_blocks}
      - {id: RESOURCE_LIST, label: Resource list, maps_to: POST, status: proposed_requires_link_validation_and_metadata_contract}
    fiction_and_text:
      - {id: STORY, label: Story, maps_to: POST, status: only_if_post_contract_supports_fiction_metadata}
      - {id: SHORT_STORY, label: Short story, maps_to: POST, status: proposed_requires_fiction_metadata_contract}
      - {id: FLASH_FICTION, label: Flash fiction, maps_to: POST, status: proposed_requires_fiction_metadata_contract}
      - {id: NOVEL, label: Novel, maps_to: null, status: blocked_until_book_content_model_approved}
