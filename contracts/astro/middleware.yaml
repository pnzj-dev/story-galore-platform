schema: storygalore.astro-middleware/v1
version: 1
pipeline:
  - request_id
  - locale_resolution
  - direction_resolution
  - session_context
  - actor_context
  - feature_flag_context
  - policy_context
  - next
locals:
  canonical: true
  must_be_typed: true
security:
  middleware_is_not_authority: true
  policy_engine_is_authority: true
  no_privileged_secrets_in_locals: true
  no_payment_credentials_in_locals: true
  no_byok_plaintext_in_locals: true

route_protection:
  registry: contracts/astro/routes.yaml
  policy_contract: contracts/astro/route-protection.yaml
  authenticate_and_authorize_before_render: true
  backend_policy_engine_remains_authority: true
  mutation_api_errors_not_browser_redirects: true
  client_supplied_roles_untrusted: true
  missing_route_mapping: BLOCK
