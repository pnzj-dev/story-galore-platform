schema: storygalore.route-inventory/v1
version: 1
status: canonical_v1_planned_inventory
source_of_truth: contracts/astro/route-inventory.yaml
scope: planned V1 routes; not a claim that route files are implemented
dynamic_path_syntax: Colon-prefixed segments are Astro dynamic route parameters and
  must match actual [param] route files. Catch-all segments require explicit entries
  and are forbidden by default.
route_count: 105
rules:
  every_route_must_have_exactly_one_policy: true
  unknown_route: BLOCK
  admin_routes_must_match_admin_rbac_exactly: true
  route_files_must_be_generated_from_astro_files_at_implementation_time: true
  planned_inventory_must_equal_scaffolded_inventory_before_route_implementation: true
  route_override_may_only_strengthen_parent_policy: true
  api_endpoints_and_actions_are_registered_separately: true
  trailing_slash_normalization: remove trailing slash except root
  method_specific_policies_required_for_api_routes: true
admin_app_split:
  non_destructive_surface: /admin (apps/web)
  destructive_app: apps/admin (standalone, intranet)
  classification_rule: risk IN [HIGH, CRITICAL] AND approval == REQUIRED => destructive => apps/admin
  contract: contracts/admin/admin-app-split.yaml
  note: destructive routes remain in this inventory for registry parity but are served by apps/admin at runtime, not the public /admin surface
