schema: storygalore.contract-scenarios/v1
version: 1
policy: fail_closed
scenarios:
- id: undeclared-secret
  given: provider_secret_not_registered
  when: adapter_start
  then: BLOCK
- id: secret-redaction
  given: provider_secret
  when: log_or_agent_context
  then: FORBIDDEN
- id: webhook-secret-scope
  given: webhook_secret
  when: non_webhook_executor_requests_access
  then: BLOCK
